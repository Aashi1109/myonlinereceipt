worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;

  client_body_temp_path /tmp/nginx/client;
  proxy_temp_path /tmp/nginx/proxy;
  client_max_body_size 16m;

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  map $http_x_forwarded_port $forwarded_port {
    default $http_x_forwarded_port;
    "" $server_port;
  }

  # Production ingress must preserve the original subdomain in Host.
  map $host $app_port {
    ~^paperwork\. 3101;
    ~^devtools\. 3102;
    ~^admin\. 3103;
    ~^auth\. 3104;
    ~^media\. 3105;
    default 3100;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Forwarded-Port $forwarded_port;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_buffering off;

  server {
    listen 8080 default_server;
    server_name _;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://127.0.0.1:$app_port;
    }
  }

  server {
    listen 3000;
    location / { proxy_pass http://127.0.0.1:3100; }
  }

  server {
    listen 3001;
    location / { proxy_pass http://127.0.0.1:3101; }
  }

  server {
    listen 3002;
    location / { proxy_pass http://127.0.0.1:3102; }
  }

  server {
    listen 3003;
    location / { proxy_pass http://127.0.0.1:3103; }
  }

  server {
    listen 3004;
    location / { proxy_pass http://127.0.0.1:3104; }
  }

  server {
    listen 3005;
    location / { proxy_pass http://127.0.0.1:3105; }
  }
}
