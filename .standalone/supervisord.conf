[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:platform]
priority=10
directory=/app/apps/platform
command=node server.js
environment=PORT="3100",HOSTNAME="127.0.0.1",DATABASE_URL="",BETTER_AUTH_SECRET="",RESEND_API_KEY="",GOOGLE_CLIENT_ID="",GOOGLE_CLIENT_SECRET="",GEMINI_API_KEY="",AHREFS_API_KEY=""
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

