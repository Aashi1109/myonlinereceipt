name: smarttools

x-database: &database
  DATABASE_URL: "postgres://${POSTGRES_USER:-smarttools}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-smarttools}"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-smarttools}"
      POSTGRES_USER: "${POSTGRES_USER:-smarttools}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      target: migrator
    environment:
      <<: *database
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
    init: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database
      APP_URL: "${APP_URL:?Set APP_URL in .env}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}"
      RESEND_API_KEY: "${RESEND_API_KEY:?Set RESEND_API_KEY in .env}"
      AUTH_EMAIL_FROM: "${AUTH_EMAIL_FROM:?Set AUTH_EMAIL_FROM in .env}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      SUPPORT_EMAIL: "${SUPPORT_EMAIL:-}"
      AHREFS_API_KEY: "${AHREFS_API_KEY:-}"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
